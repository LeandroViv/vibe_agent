name: 🤖 Vibe Coding Agent (GitHub Runner)

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  vibe-build-loop:
    if: github.event.comment.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
    - name: 📂 Checkout del repositorio
      uses: actions/checkout@v4

    - name: 💾 Configurar Caché de Ollama
      id: cache-ollama
      uses: actions/cache@v4
      with:
        path: ~/.ollama
        key: ${{ runner.os }}-ollama-qwen25-3b

    # INSTALACIÓN DIRECTA EN EL RUNNER (Reemplaza la acción que fallaba)
    - name: 🦙 Instalar y Levantar Ollama de forma Nativa
      run: |
        echo "📥 Descargando e instalando Ollama oficialmente..."
        curl -fsSL https://ollama.com/install.sh | sh
        
        echo "🚀 Iniciando el servicio de Ollama de fondo..."
        ollama serve &
        
        echo "⏳ Esperando que el servidor responda..."
        sleep 5
        
        echo "📥 Descargando el modelo Qwen 2.5 Coder 3B..."
        ollama pull qwen2.5-coder:3b

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Instalar dependencias del script
      run: pip install requests

    - name: 🤖 Ejecutar Agente (Bucle de Auto-Corrección)
      id: agent-loop
      env:
        PROMPT_CHAT: ${{ github.event.comment.body || github.event.issue.body }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python .github/scripts/vibe_agent.py

    - name: 💬 Publicar Resultado en el Chat del Issue
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let reporte = "❌ El agente falló de manera crítica al inicializar.";
          if (fs.existsSync('vibe_report.txt')) {
            reporte = fs.readFileSync('vibe_report.txt', 'utf8');
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: reporte
          });
